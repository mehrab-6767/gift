<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8e1c30"/>
      <stop offset="60%" stop-color="#6A2135"/>
      <stop offset="100%" stop-color="#3d0a16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Rim & Burgundy Seal -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 1.5"/>
  
  <!-- Glowing Heart -->
  <path d="M32 46 C32 46, 17 35.5, 17 25 C17 19.5, 21.5 16, 26 16 C29 16, 31 17.8, 32 19.5 C33 17.8, 35 16, 38 16 C42.5 16, 47 19.5, 47 25 C47 35.5, 32 46, 32 46 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"/>
        
  <!-- Sparkle Star at top-right -->
  <path d="M43 14 L44.2 17.8 L48 19 L44.2 20.2 L43 24 L41.8 20.2 L38 19 L41.8 17.8 Z" fill="#FFF8DC" />
</svg>